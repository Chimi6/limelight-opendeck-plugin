name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tag matches crate version
        run: packaging/check-versions.sh "${GITHUB_REF_NAME#v}"

      - name: Build
        run: packaging/build-binary.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: plugin/io.github.chimi6.limelight.sdPlugin/bin/limelight-openaction-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: plugin/io.github.chimi6.limelight.sdPlugin/bin

      - name: Package
        run: packaging/package.sh

      - name: Release notes
        run: packaging/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: notes.md
