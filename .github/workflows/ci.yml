name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: packaging/build-binary.sh

      - name: Versions match
        run: packaging/check-versions.sh

      - name: Manifest and layouts are valid JSON
        run: |
          for f in plugin/*/manifest.json plugin/*/layouts/*.json; do
            jq empty "$f"
          done

      - name: Icons are up to date
        run: |
          cargo run --release --bin gen-icons -- plugin/io.github.chimi6.limelight.sdPlugin/images > /dev/null
          git diff --exit-code -- plugin/

      - name: Package
        run: packaging/package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-bundle-ci
          path: dist/*.zip
          retention-days: 7
