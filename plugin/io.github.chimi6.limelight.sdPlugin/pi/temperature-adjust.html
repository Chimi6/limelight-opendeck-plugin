<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="common.css" />
	<script src="common.js"></script>
</head>
<body data-targets="any">
	<div class="row"><label>Target</label><div class="field"><select id="target"></select><button id="identify" hidden title="Blink this light">Blink</button></div></div>
	<div class="hint" id="no-lights" hidden>No lights found. Press a Scan key or add lights in LimeLight.</div>
	<div class="row"><label>Step</label><div class="field"><input type="number" min="-1000" max="1000" step="50" data-setting="step" data-default="250" /><span>K per press (negative is warmer)</span></div></div>
</body>
</html>
