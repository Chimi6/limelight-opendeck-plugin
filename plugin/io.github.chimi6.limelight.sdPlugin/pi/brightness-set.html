<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="common.css" />
	<script src="common.js"></script>
</head>
<body data-targets="any">
	<div class="row"><label>Target</label><div class="field"><select id="target"></select><button id="identify" hidden title="Blink this light">Blink</button></div></div>
	<div class="hint" id="no-lights" hidden>No lights found. Press a Scan key or add lights in LimeLight.</div>
	<div class="row"><label>Brightness</label><div class="field"><input type="range" min="0" max="100" step="1" data-setting="value" data-default="50" data-suffix="%" /><output data-for="value"></output></div></div>
	<div class="row"><label>Turn on</label><div class="field"><input type="checkbox" data-setting="turnOn" data-default="true" /></div></div>
</body>
</html>
