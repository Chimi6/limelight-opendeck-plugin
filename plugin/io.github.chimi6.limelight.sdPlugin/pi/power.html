<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="common.css" />
	<script src="common.js"></script>
</head>
<body data-targets="any">
	<div class="row"><label>Target</label><div class="field"><select id="target"></select><button id="identify" hidden title="Blink this light">Blink</button></div></div>
	<div class="hint" id="no-lights" hidden>No lights found. Press a Scan key or add lights in LimeLight.</div>
	<div class="row"><label>Action</label><div class="field"><select data-setting="mode" data-default="toggle"><option value="toggle">Toggle</option><option value="on">Turn on</option><option value="off">Turn off</option></select></div></div>
</body>
</html>
