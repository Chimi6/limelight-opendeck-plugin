<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="common.css" />
	<script src="common.js"></script>
</head>
<body data-targets="any">
	<div class="row"><label>Target</label><div class="field"><select id="target"></select><button id="identify" hidden title="Blink this light">Blink</button></div></div>
	<div class="hint" id="no-lights" hidden>No lights found. Press a Scan key or add lights in LimeLight.</div>
	<div class="row"><label>Label</label><div class="field"><input type="text" data-setting="label" placeholder="Shown on the key" /></div></div>
	<div class="row"><label>Power</label><div class="field"><input type="checkbox" data-setting="on" data-default="true" /><span>On</span></div></div>
	<div class="row"><label>Brightness</label><div class="field"><input type="range" min="0" max="100" step="1" data-setting="brightness" data-default="50" data-suffix="%" /><output data-for="brightness"></output></div></div>
	<div class="row"><label>Temperature</label><div class="field"><input type="range" min="2900" max="7000" step="50" data-setting="kelvin" data-default="4500" data-suffix="K" /><output data-for="kelvin"></output></div></div>
	<div class="row"><label>Use colour</label><div class="field"><input type="checkbox" data-setting="useColor" data-default="false" /><input type="color" id="picker" value="#ff8800" /><output id="picker-out"></output></div></div>
	<div class="hint">Colour applies to Light Strips only and replaces the temperature.</div>
	<script src="color-picker.js"></script>
	<script>
		bindColorPicker(document.getElementById("picker"), document.getElementById("picker-out"), false);
	</script>
</body>
</html>
