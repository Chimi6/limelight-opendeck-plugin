[package]
name = "limelight-openaction"
version = "1.0.0"
edition = "2024"
description = "OpenDeck plugin that controls Elgato lights through the LimeLight daemon"
license = "MIT"
repository = "https://github.com/Chimi6/limelight-opendeck-plugin"
readme = "README.md"
rust-version = "1.88"
default-run = "limelight-openaction"

[[bin]]
name = "limelight-openaction"
path = "src/main.rs"

[[bin]]
name = "gen-icons"
path = "src/bin/gen_icons.rs"

[dependencies]
openaction = "2.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json"] }
log = "0.4"
simplelog = "0.12"
base64 = "0.22"
dashmap = "6"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
